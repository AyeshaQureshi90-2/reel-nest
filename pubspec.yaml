
name: reel_nest
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  http: ^1.6.0
  youtube_player_flutter: ^10.0.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/reel_nest_splash.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/reel_nest_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#08090D"
  image: assets/images/transparent.png
  android: true
  ios: false
  android_12:
    color: "#08090D"
    image: assets/images/transparent.png
